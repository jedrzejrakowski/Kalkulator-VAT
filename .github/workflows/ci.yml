name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nowy push do gałęzi unieważnia poprzedni, jeszcze trwający przebieg.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testy:
    name: Testy i build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Kontrola typów
        run: npx tsc -b

      - name: Testy logiki podatkowej
        run: npm test

      - name: Build produkcyjny
        run: npm run build

      # Caddy podaje /srv/apps/kalkulator-samochod pod samochod.apkownia.cloud.
      # DEPLOY_KEY: klucz konta deploy (base64), ten sam co w Kalkulatorze walut.
      # Bez niego krok się pomija.
      - name: Wdrożenie na VPS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "Brak sekretu DEPLOY_KEY — pomijam wdrożenie."; exit 0; fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 179.198.212.201 >> ~/.ssh/known_hosts
          rsync -az --delete dist/ deploy@179.198.212.201:/srv/apps/kalkulator-samochod/
