name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nowy push do gałęzi unieważnia poprzedni, jeszcze trwający przebieg.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testy:
    name: Testy i build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Kontrola typów
        run: npx tsc -b

      - name: Testy logiki podatkowej
        run: npm test

      - name: Build produkcyjny
        run: npm run build

      # Dane konta FTP z hPanelu (Pliki → Konta FTP) w sekretach repozytorium.
      # Bez nich krok się pomija. Bez --delete: stare pliki zostają, ale
      # wdrożenie nie skasuje niczego, co leży obok w tym samym katalogu.
      - name: Wdrożenie na Hostinger
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          if [ -z "$FTP_SERVER" ]; then echo "Brak sekretów FTP — pomijam wdrożenie."; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" \
            -e "mirror -R --verbose dist ${FTP_DIR:-public_html}; quit"
